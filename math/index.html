<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学 — 学习馆</title>
<meta name="description" content="小学数学主题课：图形与几何、数与数感、数与运算。每个主题都有孩子用的互动课堂（含每课小考）和老师用的掌握程度与讲解大纲。">
<link rel="stylesheet" href="assets/topic.css">
<style>
  .ttabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px}
  .ttab{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
    border-radius:99px;padding:10px 16px;cursor:pointer;font:inherit;font-size:15px;font-weight:600;color:var(--text)}
  .ttab:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .ttab.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
  .ttab .em{font-size:17px}
  .ttab .bd{font-size:11.5px;font-weight:600;background:var(--line2);color:var(--muted);border-radius:99px;padding:2px 9px}
  .ttab.on .bd{background:var(--accent);color:#fff}
  .panel + .panel{margin-top:14px}
  .note{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;font-size:14px;color:var(--muted)}
  .note b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="crumb">
    <a href="../index.html">← 学习馆</a>
    <span style="color:var(--muted)">数学</span>
    <span class="sp"></span>
    <button class="ico" id="themeBtn" title="切换深浅色 (T)">◐</button>
  </div>

  <header class="hero">
    <div class="kicker">MATH</div>
    <h1>数学<small style="display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:8px">
      按主题分开学：每个主题一套「互动课堂（孩子用）＋ 教师版（掌握程度 / 易错与提问 / 教学大纲）」。
    </small></h1>
  </header>

  <div class="ttabs" id="topicTabs"></div>
  <div id="panel"></div>

  <div class="note">
    <b>关于这些主题</b><br>
    每个主题都是独立的一小门课：10 课左右、有动手实验、每课学完出一张小考卷，答错不扣分、会记下来给家长看。
    进度存在你自己的浏览器里，换设备不同步。点上面的标签切换主题。
  </div>

  <footer>
    <div>内容按北京师范大学出版社《义务教育教科书·数学》1—6 年级的编排顺序整理；文字、图示、练习均为原创制作，本站不收录教材原文或扫描件。</div>
    <div>教材版权属北京师范大学出版社。本站仅作个人学习用途。</div>
    <div>源码仓库：<a href="https://github.com/moneyache/kids_study">github.com/moneyache/kids_study</a></div>
  </footer>
</div>

<script src="topics.js"></script>
<script src="geometry/data.js"></script>
<script src="numbers/data.js"></script>
<script src="calculation/data.js"></script>
<script src="measure/data.js"></script>
<script src="assets/hub.js"></script>
<script>KIDS_HUB.boot();</script>
</body>
</html>
